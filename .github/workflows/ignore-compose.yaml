concurrency:
  cancel-in-progress: false
  group: ignore-compose
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  build:
    needs: [check]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        name: install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: bash script/ignore-compose.sh job__package step__build ${{ matrix.target }}
      - run: bash script/ignore-compose.sh job__package step__archive ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{ matrix.target }}
          path: source/ignore-compose-cli/dist/ignore-compose-${{ matrix.target }}.tar.gz
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
    timeout-minutes: 20
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: bash script/ignore-compose.sh job__check step__fmt
      - run: bash script/ignore-compose.sh job__check step__clippy
      - run: bash script/ignore-compose.sh job__check step__wasm
      - run: bash script/ignore-compose.sh job__check step__web
    timeout-minutes: 20
  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: source/ignore-compose-cli/dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash script/ignore-compose.sh job__package step__release
    timeout-minutes: 10
name: ignore-compose
on:
  push:
  workflow_dispatch:
permissions:
  contents: write