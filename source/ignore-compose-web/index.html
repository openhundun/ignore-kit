<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light" />
        <title>ignore-compose</title>
    </head>
    <body
        class="m-0 h-dvh overflow-hidden p-[30px] font-sans text-[13px] leading-[1.45] tracking-[-0.012em] text-[#1d1d1f] antialiased max-[640px]:p-4"
    >
        <div
            id="root"
            class="flex h-full flex-col overflow-hidden rounded-xl border border-[#d2d2d7] bg-white shadow-[0_10px_40px_rgba(0,0,0,0.12)]"
        ></div>
        <script>
            window.setTimeout(() => {
                if (window.ignoreComposeBooted) return;
                let status = document.getElementById("boot-error");
                if (!status) {
                    status = document.createElement("p");
                    status.id = "boot-error";
                    status.setAttribute("role", "status");
                    status.setAttribute("aria-live", "polite");
                    status.className =
                        "pointer-events-none fixed bottom-4 left-1/2 z-40 -translate-x-1/2 rounded-lg bg-[#b42318] px-3.5 py-[7px] text-[12px] text-white";
                    document.body.appendChild(status);
                }
                status.textContent =
                    "Page script did not start: the bundle is missing. Run bash script/ignore-compose.sh web and serve the dist directory over HTTP.";
            }, 4000);
        </script>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
