<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ignore-compose</title>
    </head>
    <body class="min-h-screen bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
        <div id="root"></div>
        <script>
            window.setTimeout(() => {
                if (window.ignoreComposeBooted) return;
                let status = document.getElementById("status");
                if (!status) {
                    status = document.createElement("p");
                    status.id = "status";
                    status.setAttribute("role", "status");
                    status.setAttribute("aria-live", "polite");
                    status.className =
                        "mx-auto my-8 max-w-3xl rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-800 dark:border-red-800 dark:bg-red-950 dark:text-red-200";
                    document.body.appendChild(status);
                }
                status.textContent =
                    "页面脚本未启动：缺少打包产物（assets/*.js）。请先运行 bash script/ignore-compose.sh web，再以 dist 目录为根通过 HTTP 服务打开本页。";
            }, 4000);
        </script>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
