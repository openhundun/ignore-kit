[workspace]
members  = ["source/ignore-compose-cli", "source/ignore-compose-lib"]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "MIT"
repository   = "https://github.com/openhundun/ignore-kit"
rust-version = "1.85"
version      = "0.0.1"

[workspace.dependencies]
schemars   = { version = "1.2.3" }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
tempfile   = { version = "3.27.0" }
ts-rs      = { version = "12.0.1" }
ureq       = { version = "2.12.1" }

[profile.release]
lto   = true
strip = true
